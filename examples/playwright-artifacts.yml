# Add equivalent steps to the target repository's existing Playwright workflow.
# Pin @playwright/test in package-lock.json and enable trace: 'retain-on-failure',
# screenshot: 'only-on-failure' in playwright.config.ts.
name: Browser tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
