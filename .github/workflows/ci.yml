name: Quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Python ${{ matrix.python-version }} and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.6"
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev
      - run: uv tool run pip-audit==2.10.1 --path .venv/lib/python${{ matrix.python-version }}/site-packages --skip-editable
      - run: uv run playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src/failurelab
      - run: uv run pytest --cov=failurelab --cov-report=xml --junitxml=var/test-results.xml
      - run: uv run failurelab evaluate --min-accuracy 0.8
      - name: Preserve verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failurelab-verification-python-${{ matrix.python-version }}
          retention-days: 14
          path: |
            var/evaluation.json
            var/test-results.xml
            coverage.xml
            docs/screenshots/
