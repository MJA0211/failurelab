name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.6"
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev
      - run: uv tool run pip-audit==2.10.1 --path .venv/lib/python3.12/site-packages --skip-editable
      - run: uv run playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend
      - run: uv run ruff check src tests
      - run: uv run pytest --cov=failurelab --cov-report=xml --junitxml=var/test-results.xml
      - run: uv run failurelab evaluate --min-accuracy 0.8
      - name: Preserve verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failurelab-verification
          path: |
            var/evaluation.json
            var/test-results.xml
            coverage.xml
            docs/screenshots/
