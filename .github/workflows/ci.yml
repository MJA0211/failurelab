name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev
      - run: uv run playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: frontend
      - run: uv run ruff check src tests
      - run: uv run pytest --cov=failurelab --cov-report=xml --junitxml=var/test-results.xml
      - run: uv run failurelab evaluate --min-accuracy 0.8
      - name: Preserve verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failurelab-verification
          path: |
            var/evaluation.json
            var/test-results.xml
            coverage.xml
            docs/screenshots/
