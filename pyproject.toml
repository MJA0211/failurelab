[project]
name = "failurelab"
version = "0.1.0"
description = "Evidence-first CI investigations with reproducible browser experiments"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "playwright>=1.51,<2",
  "rank-bm25>=0.2.2,<1", "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "respx>=0.22,<1"]
ml = ["sentence-transformers>=3,<6"]
postgres = ["psycopg[binary,pool]>=3.2,<4", "langgraph-checkpoint-postgres>=3,<4"]

[project.scripts]
failurelab = "failurelab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/failurelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["browser: executes a real Chromium browser", "integration: external service integration"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["failurelab"]
branch = true
